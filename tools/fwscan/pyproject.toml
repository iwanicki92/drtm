[project]
name = "fwscan"
version = "0.1.0"
description = "Look for an SL key allowlist in a firmware image's PSP DRTM TA"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = [
    "capstone>=5.0",
    # GPL-3.0: fwscan runs its CLI as a separate program and never imports it.
    # 3.7 is the first release that parses the newer client ROMs.
    "psptool>=3.7",
]

[project.scripts]
fwscan = "fwscan.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
