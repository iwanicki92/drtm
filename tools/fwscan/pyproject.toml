[project]
name = "fwscan"
version = "0.1.0"
description = "Look for an SL key allowlist in a firmware image's PSP DRTM TA"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = [
    "capstone>=5.0",
    "psptool",
]

[project.scripts]
fwscan = "fwscan.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
# GPL-3.0: fwscan runs its CLI as a separate program and never imports it.
# The fork parses client ROMs that upstream 6112e48 does not. A tarball,
# because a git source clones the private fixtures submodule too.
psptool = { url = "https://github.com/iwanicki92/PSPTool/archive/66ef5aa94f8d44321d305de59da4275f4cd79d05.tar.gz" }

[tool.uv.extra-build-variables]
# psptool takes its version from git, which a tarball does not carry.
psptool = { SETUPTOOLS_SCM_PRETEND_VERSION = "3.6+fork.66ef5aa" }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
