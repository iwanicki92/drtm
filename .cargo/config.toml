[build]
target = "x86_64-unknown-uefi"

[alias]
# The members that are not the EFI binary build for other targets, and a
# bare `cargo test` would build them for UEFI. See docs/development.md.
test-host = "test --target x86_64-unknown-linux-gnu -p common"

# The Secure Loader runs where its page tables put it, `SL_VBASE` in
# sl/sl.ld in the top 2 GiB, so it links there statically and carries no
# relocations for anything to apply.
[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static", "-C", "code-model=kernel"]
