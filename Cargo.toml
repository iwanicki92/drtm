[package]
name = "drtm"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

[features]
default = ["sink-serial"]
# Where log records go. See src/logging.rs.
sink-serial = []
sink-console = []

[dependencies]
common = { path = "common" }
log = "0.4"
uefi = { version = "0.36.1", features = ["alloc", "global_allocator", "panic_handler"] }

[build-dependencies]
common = { path = "common" }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
sign = { path = "sign" }

[lints]
workspace = true

[workspace]
members = [".", "common", "dlme", "sign", "sl"]
# `cargo build` at the root builds the EFI binary. The other members target
# something else, see docs/development.md.
default-members = ["."]

[workspace.lints.clippy]
# Every unsafe block must say why it is sound. `warn` rather than `deny`
# because pre-commit runs clippy with `-D warnings` anyway, and a bare
# `cargo clippy` during development should report rather than stop.
undocumented_unsafe_blocks = "warn"

# The Secure Loader and the DLME, which build.rs builds with this profile.
# The SL's measured image has to stay under 60 KiB with room left in the
# SLB behind it.
[profile.sl]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
