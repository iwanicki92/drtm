[package]
name = "drtm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = ["sink-serial"]
# Where log records go. See src/logging.rs.
sink-serial = []
sink-console = []

[dependencies]
log = "0.4"
uefi = { version = "0.36.1", features = ["alloc", "global_allocator", "panic_handler"] }
