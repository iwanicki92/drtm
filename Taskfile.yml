version: "3"

tasks:
  build:
    desc: Build the UEFI binary
    cmds:
      - cargo build

  lint:
    desc: Run all linters and formatters (see .pre-commit-config.yaml)
    cmds:
      - pre-commit run --all-files

  test:
    desc: Run the QEMU smoke test suite (builds the binary itself first)
    cmds:
      - uv run --project qemu-tests pytest qemu-tests

  docs:
    desc: Regenerate offline dependency docs (target/x86_64-unknown-uefi/doc)
    cmds:
      - cargo doc --no-deps -p log -p uefi -p uefi-raw -p uefi-macros
      - cp docs/rustdoc-index.html target/x86_64-unknown-uefi/doc/index.html
