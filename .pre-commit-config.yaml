---
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/3mdeb/hooks
    rev: v0.2.2
    hooks:
      - id: replace-hyphen-like

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^qemu-tests/
      - id: ruff-format
        files: ^qemu-tests/

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.65
    hooks:
      - id: ty
        args: [--project, qemu-tests]
        files: ^qemu-tests/

  - repo: local
    hooks:
      # One run over the workspace: batches in parallel would each rewrite
      # every crate's files at once and can leave one empty.
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code
        entry: cargo fmt
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code
        entry: cargo clippy -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy-sl
        name: cargo clippy (sl)
        description: Lint the Secure Loader for its own target
        entry: cargo clippy -p sl --target x86_64-unknown-none --profile sl -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy-common
        name: cargo clippy (common)
        description: Lint the shared crate and its tests on the host
        entry: cargo clippy -p common --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false
